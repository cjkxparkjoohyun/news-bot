name: News Auto Crawler

on:
  schedule:
    # 한국시간 08, 10, 12, 15, 17, 19, 23시 (UTC 시각 변환 기준)
    - cron: '0 23 * * 0-4' # KST 08시 (일~목 UTC 23시)
    - cron: '0 1,3,6,8,10,14 * * 1-5' # KST 10,12,15,17,19,23시 (월~금 UTC)
  workflow_dispatch: # 직접 수동 실행 가능하도록 설정

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Crawler
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
